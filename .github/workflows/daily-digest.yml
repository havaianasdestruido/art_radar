name: Daily Art Radar

on:
  schedule:
    # 10:00 UTC = 07:00 in São Paulo (UTC-3)
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    # News feed fetching is fast (feeds carry the article text); a first-ever
    # run with several sources may take a few minutes longer.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run daily digest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL || secrets.ANTHROPIC_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.ANTHROPIC_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || secrets.ANTHROPIC_MODEL }}
          REPORT_LANGS: ${{ vars.REPORT_LANGS || secrets.REPORT_LANGS }}
          DIGEST_REPO: ${{ github.repository }}
        run: pnpm start

      - name: Commit digest files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digests/
          if git diff --cached --quiet; then
            echo "No new digest files to commit"
          else
            DATE=$(date -u +%Y-%m-%d)
            git commit -m "digest: ${DATE} art radar digest"
            git pull --rebase
            git push
          fi

      - name: Update web manifest and RSS feed
        env:
          DIGEST_REPO: ${{ github.repository }}
          PAGES_URL: ${{ vars.PAGES_URL || secrets.PAGES_URL }}
          REPORT_LANGS: ${{ vars.REPORT_LANGS || secrets.REPORT_LANGS }}
        run: pnpm manifest

      - name: Commit manifest and feed
        run: |
          git add manifest.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore: update manifest.json and feed.xml"
            git pull --rebase
            git push
          fi

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DIGEST_REPO: ${{ github.repository }}
          PAGES_URL: ${{ vars.PAGES_URL || secrets.PAGES_URL }}
          REPORT_LANGS: ${{ vars.REPORT_LANGS || secrets.REPORT_LANGS }}
        run: pnpm notify
